buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
        kspVersion = "1.9.22-1.0.17"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
    // Limit all subproject (library) native builds to arm64-v8a only.
    // This prevents parallel CMake processes from locking each other's
    // intermediate files on Windows when building for multiple ABIs.
    pluginManager.withPlugin('com.android.library') {
        android {
            defaultConfig {
                ndk { abiFilters "arm64-v8a" }
            }
        }
    }
}

